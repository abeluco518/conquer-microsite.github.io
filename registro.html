<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Título para el navegador y los buscadores -->
    <title>Registrate | Conquer Blocks</title>

    <!-- Descripción de la página para los buscadores -->
    <meta
      name="description"
      content="Pagina de registro datos personales"
    />

    <!-- Palabras clave para los buscadores -->
    <meta name="keywords" content="" />

    <!-- Autor de la página -->
    <meta name="author" content="Abel" />

    <!-- Favicon de la página -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <!-- Codificación-->
    <meta charset="UTF-8" />

    <!-- Para que la web sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Para algunos navegadores móviles -->
    <meta name="theme-color" content="#1e7bbf" />

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page-login">
    <header class="header">
      <!-- Logo de la empresa -->
      <img
        class="header__logo"
        src="src/img/logo_conquer.png"
        alt="logotipo de conquer blocks"
      />
      <nav class="header__nav">
        <!-- Lista de enlaces de navegación -->
        <ol>
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="quienes_somos.html">Quiénes somos</a></li>
          <li><a href="index.html#cursos">Cursos</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="registro.html">Registro</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ol>
      </nav>
    </header>

    <footer class="footer">
      <p>
        © Copyright all rights reserveds 2020-2025 -
        <a href="aviso_legal.html">Aviso legal</a>
      </p>
    </footer>
    <div class="page">
      <main>
        <section class="register">
          <h1 class="register__title">¿Todavia no te has registrado?
            ¡Registrate aquí!</h1>
        
          <form action="#" method="get" class="register__form">
              <p>
                <label for="nombre">Nombre completo</label><br />
                <input type="text" name="nombre" id="nombre" />
              </p>
              <p>
                <label for="birthday">Fecha de nacimiento</label><br />
                <input type="date" name="birthday" id="birthday" />
              </p>
              <p>
                <label for="photo">Fotografía retrato</label><br />
                <input type="file" name="photo" id="photo" />
              </p>
              
              <p>
                <label for="correoelectronico">Correo elctrónico</label><br />
                <input type="email" name="correo" id="correoelectronico" />
              </p>
              <p>
                <label for="web">Página web</label><br />
                <input type="search" name="web_name" id?="web" />
              </p>
            
            <p>
                <label for="biografia">Biografía (máx. 60 caracteres)</label
                ><br />
                <textarea
                  name="biografia"
                  id="biografia"
                  rows="3"
                  cols="60"
                ></textarea>
              </p>
              <p>
                <button class="register__button">Siguiente</button>
              </p>

          </form>
        </section>
      </main>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
